<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>eClinic - Login</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #0d47a1, #1976d2, #d32f2f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 900px;
            min-height: 550px;
            background: white;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        /* LEFT SIDE */

        .left {
            width: 45%;
            background: #1565c0;
            color: white;
            padding: 60px 45px;
        }

        .left h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .left span {
            color: #ff5252;
        }

        .left p {
            line-height: 1.7;
            color: #e3f2fd;
        }

        .clinic-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        /* RIGHT SIDE */

        .right {
            width: 55%;
            padding: 45px;
        }

        .right h2 {
            color: #123b63;
            margin-bottom: 25px;
        }

        /* TABS */

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #eaf3ff;
            color: #1565c0;
            cursor: pointer;
            font-weight: bold;
        }

        .tabs button.active {
            background: #1565c0;
            color: white;
        }

        /* FORM */

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .name-row {
            display: flex;
            gap: 10px;
        }

        .name-row input {
            width: 50%;
        }

        .submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #d32f2f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit:hover {
            background: #b71c1c;
        }


        /* =========================
           PHONE VERSION
           ========================= */

        @media (max-width: 700px) {

            body {
                padding: 15px;
                align-items: flex-start;
                padding-top: 25px;
            }

            .container {
                width: 100%;
                min-height: auto;
                display: block;
                border-radius: 15px;
            }

            .left {
                width: 100%;
                padding: 30px 25px;
                text-align: center;
            }

            .clinic-icon {
                font-size: 50px;
                margin-bottom: 5px;
            }

            .left h1 {
                font-size: 34px;
                margin: 10px 0 15px;
            }

            .left p {
                font-size: 14px;
                line-height: 1.5;
            }

            .right {
                width: 100%;
                padding: 30px 25px;
            }

            .right h2 {
                text-align: center;
                font-size: 22px;
            }

            .tabs {
                gap: 8px;
            }

            .tabs button {
                font-size: 13px;
                padding: 12px 5px;
            }

            .name-row {
                display: block;
            }

            .name-row input {
                width: 100%;
            }

            input {
                padding: 13px;
                font-size: 16px;
            }

            .submit {
                padding: 14px;
            }

        }


        /* SMALL PHONE */

        @media (max-width: 400px) {

            body {
                padding: 10px;
            }

            .left {
                padding: 25px 20px;
            }

            .right {
                padding: 25px 20px;
            }

            .left h1 {
                font-size: 30px;
            }

            .left p {
                font-size: 13px;
            }

        }

    </style>


    <script>

        function showForm(formName, button) {

            document.querySelectorAll(".form").forEach(function(form) {
                form.classList.remove("active");
            });

            document.querySelectorAll(".tabs button").forEach(function(btn) {
                btn.classList.remove("active");
            });

            document.getElementById(formName).classList.add("active");

            button.classList.add("active");
        }

    </script>

</head>


<body>


    <div class="container">


        <!-- LEFT -->

        <div class="left">

            <div class="clinic-icon">
                🏥
            </div>

            <h1>
                e<span>Clinic</span>
            </h1>

            <p>
                Your simple and organized clinic management system.
            </p>

            <p>
                Book appointments, manage your schedule,
                and keep your appointment information organized.
            </p>

        </div>


        <!-- RIGHT -->

        <div class="right">

            <h2>
                Welcome to eClinic
            </h2>


            <div class="tabs">

                <button
                    class="active"
                    onclick="showForm('loginForm', this)">
                    Login
                </button>

                <button
                    onclick="showForm('registerForm', this)">
                    Create Account
                </button>

            </div>


            <!-- LOGIN -->

            <div
                id="loginForm"
                class="form active">

                <form
                    action="/login"
                    method="POST">

                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required>

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required>

                    <button
                        class="submit"
                        type="submit">

                        Login

                    </button>

                </form>

            </div>


            <!-- REGISTER -->

            <div
                id="registerForm"
                class="form">

                <form
                    action="/register"
                    method="POST">

                    <div class="name-row">

                        <input
                            type="text"
                            name="first_name"
                            placeholder="First Name"
                            required>

                        <input
                            type="text"
                            name="last_name"
                            placeholder="Last Name"
                            required>

                    </div>


                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required>


                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required>


                    <button
                        class="submit"
                        type="submit">

                        Create Account

                    </button>

                </form>

            </div>

        </div>

    </div>


</body>

</html>
