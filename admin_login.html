<!DOCTYPE html>
<html>
<head>
    <title>eClinic Admin</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1565c0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            width: 350px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            color: #1565c0;
        }

        h1 span {
            color: #d32f2f;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d32f2f;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>e<span>Clinic</span></h1>

        <h2>Admin Login</h2>

        <form action="/admin/login" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

    </div>

</body>
</html>
